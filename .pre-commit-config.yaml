fail_fast: true

repos:
# First, so fail_fast never skips it. Checks only the staged changes; the
# secret_detection CI job scans what gets pushed.
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    - id: gitleaks

- repo: local
  hooks:
    - id: renormalize
      name: renormalize
      entry: git add --renormalize .
      language: unsupported
      pass_filenames: false

    - id: format
      name: cargo-fmt
      entry: cargo fmt --manifest-path t32mcp-rs/Cargo.toml
      language: unsupported
      types: [rust]
      pass_filenames: false

    - id: lint
      name: cargo-clippy
      entry: cargo clippy --manifest-path t32mcp-rs/Cargo.toml
      language: unsupported
      types: [rust]
      pass_filenames: false

    - id: build
      name: cargo-build
      entry: cargo build --manifest-path t32mcp-rs/Cargo.toml
      language: unsupported
      types: [rust]
      pass_filenames: false

    - id: cargo-test
      name: cargo-test
      entry: ci/test_rust.sh
      language: unsupported
      types: [rust]
      pass_filenames: false

    - id: test
      name: pytest
      entry: uv run --directory tests pytest
      language: unsupported
      types: [rust]
      pass_filenames: false
